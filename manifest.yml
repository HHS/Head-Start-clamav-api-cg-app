---
applications:
- name: clamav-api-((project))
  instances: 1
  memory: 4G
  disk_quota: 2G
  docker:
    image: ajilaag/clamav-rest:latest
  routes:
  - route: clamapi-((project)).apps.internal
  health-check-type: http
  health-check-http-endpoint: /
  health-check-invocation-timeout: 5
  health-check-interval: 60
  timeout: 120
  env:
    MAX_FILE_SIZE: 30M